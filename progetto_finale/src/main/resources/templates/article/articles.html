<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:insert="~{index :: head}"></head>

    <body>

    <div th:insert="~{index :: navbar}"></div>

        <div class="min-vh-100">
            <div class="alert alert-success" th:if="${successMessage}">
                <p th:text="${successMessage}"></p>
            </div>

            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-10 mb-5">
                        <h1 class="text-center" th:text="${title}">Index article</h1>
                    </div>
                </div>
            </div>

            <div th:if="${articles.size() > 0}" class="container">
                <div class="row justify-content-center mb-5">
                    <div class="col-12 col-md-4 d-flex justify-content-center" th:each="article:${articles}">
                        <div class="card mb-3" style="width: 18rem">
                            <img th:if="${article.image != null}" th:src="${article.image.path}" alt="..." class="card-img-top">
                            <img th:unless="${article.image != null}" th:src="@{/images/default.jpg}" alt="..." class="card-img-top">

                            <div class="card-body">
                                <h5 class="card-title" th:text="${article.title}"></h5>
                                <p class="card-text" th:text="${article.subtitle}"></p>
                                <p class="card-text" th:text="${article.user.username}"></p>

                                <a th:href="@{/articles/detail/{id}(id=${article.id})}" class="btn btn-primary">Leggi</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row justify-content-center vh-100" th:unless="${articles.size() > 0}">
                <div class="col-10 mb-5">
                    <h1 class="text-center">NESSUN ARTICOLO PRESENTE</h1>
                </div>
            </div>
        </div>

        <div th:insert="~{index :: footer}"></div>
        <script th:replace="~{index :: bootstrapScript}"></script>
    </body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head th:fragment = "head">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

        <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

        <title th:text ="${title}">Title</title>
    </head>
    <body>
        <!--inizio navbar-->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light bg-light">

        <div class="container-fluid">
            <a th:href="@{/}" class="navbar-brand">Aulab Chronicle</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                    aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a href="/articles/create" class="nav-link">Crea un articolo</a>
                    </li>

                    <li class="nav-item">
                        <a href="/articles" class="nav-link">Tutti gli articoli</a>
                    </li>

                    <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
                        <div class="d-flex">
                            <a th:href="@{/admin/dashboard}" class="nav-link">Dashboard Admin</a>
                            <div class="mt-1" th:if="${careerRequests > 0}">
                                <i class="fa-solid fa-bell pt-2"></i>
                                <span class="badge rounded-pill bg-danger text-white px-1" th:text="${careerRequests}"></span>
                            </div>
                        </div>
                    </li>

                    <li class="nav-item" sec:authorize="hasRole('ROLE_REVISOR')">
                        <div class="d-flex">
                            <a class="nav-link" href="/revisor/dashboard">Dashboard revisor</a>
                            <div class="mt-1" th:if="${articlesToBeRevised > 0}">
                                <i class="fas fa-bell fa-1 pt-2"></i>
                                <span class="badge rounded-pill bg-danger text-white px-1" th:text="${articlesToBeRevised}"></span>
                            </div>
                        </div>
                    </li>

                    <li class="nav-item">
                        <a href="" class="nav-link">Link</a>
                    </li>

                    <li class="nav-item" sec:authorize="isAuthenticated && hasRole('ROLE_WRITER')">
                        <a th:href="@{/writer/dashboard}" class="nav-link">Writer Dashboard</a>
                    </li>

                    <li class="nav-item dropdown">
                        <a href="#" class="nav-link dropdown-toggle" id="navbarDropdown"
                        role="button" data-bs-toggle="dropdown" aria-expanded="false"> Accesso
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdown">

                            <li sec:authorize="isAnonymous()">
                                <a th:href="@{/login}" aria-current="page" class="dropdown-item">Login</a>
                            </li>

                            <li sec:authorize="isAnonymous()">
                                <a th:href="@{/register}" aria-current="page" class="dropdown-item">Registrati</a>
                            </li>

                            <li sec:authorize="isAuthenticated()">
                                <a th:href="@{/logout}" aria-current="page" class="dropdown-item">Logout</a>
                            </li>

                        </ul>
                    </li>
                </ul>
                <div sec:authorize="isAuthenticated()" th:text="'Benvenuto: ' + ${#authentication.principal.fullname} + ' - ' + 
                ${#authentication.principal.authorities[0].authority.replace('ROLE_', '')}"></div>
            </div>
        </div>
        <form th:action="@{/articles/search}" class="d-flex" method="get">
            <input class="form-control mb-2" type="search" placeholder="search" name="keyword" aria-label="Search">
            <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
    </nav>
    <!--fine navbar-->

    <!--inizio footer-->
    <footer th:fragment="footer" class="bg-dark text-white pt-4">
        <div class="container">
            <div class="row justify-content-between">
                <div class="col-md-4 mb-3">
                    <a href="/"><h5>Aulab IT</h5></a>
                </div>
                <div class="col-md-4 mb-3 text-end">
                    <h5>Lavora con noi</h5>
                    <a th:href="@{/operations/career/request}" class="btn btn-primary">Richiedi</a>
                </div>
            </div>
        </div>
        <div class="bg-secondary text-center py-2">
            <p class="mb-0">2026 Aulab Jost. All right reserved.</p>
        </div>
    </footer>

        <script th:fragment="bootstrapScript" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <title th:text="${title}">
        Create Post
    </title>

</head>

<body>

    <div class="container">

        <div class="row">

            <div
                class="col-12 my-5 d-flex justify-content-center align-items-center">

                <span class="h1">
                    Add a Post
                </span>

            </div>


            <div class="col-12 my-5">

                <form
                    th:action="@{/posts}"
                    method="POST"
                    th:object="${post}">


                    <div class="mb-3">

                        <label
                            for="title"
                            class="form-label">

                            Title

                        </label>

                        <input
                            id="title"
                            type="text"
                            class="form-control"
                            th:field="*{title}"
                            placeholder="Title..."
                            required>

                    </div>


                    <div class="mb-3">

                        <label
                            for="body"
                            class="form-label">

                            Body

                        </label>

                        <textarea
                            id="body"
                            class="form-control"
                            th:field="*{body}"
                            placeholder="Post body..."
                            required>
                        </textarea>

                    </div>


                    <div class="mb-3">

                        <label
                            for="publishDate"
                            class="form-label">

                            Publish Date

                        </label>

                        <input
                            id="publishDate"
                            type="text"
                            class="form-control"
                            th:field="*{publishDate}"
                            placeholder="20260922">

                    </div>


                    <button
                        type="submit"
                        class="btn btn-success">

                        Save

                    </button>


                    <button
                        type="reset"
                        class="btn btn-danger">

                        Reset

                    </button>

                </form>

            </div>

        </div>

    </div>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
